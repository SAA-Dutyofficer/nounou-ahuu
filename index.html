<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYJCLwZTE2XCHF73dJC2WHJYthjvdULfY",
    authDomain: "fiona-julian.firebaseapp.com",
    databaseURL: "https://fiona-julian-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "fiona-julian",
    storageBucket: "fiona-julian.firebasestorage.app",
    messagingSenderId: "749993154853",
    appId: "1:749993154853:web:bf85c8cc95dbac5420e2cc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window._db = db;
  window._ref = ref;
  window._set = set;
  window._onValue = onValue;
  window._fbReady = true;
  document.dispatchEvent(new Event('fb-ready'));
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#FDF8F2;
  --warm:#FFFCF8;
  --sage:#7A9E8A;
  --sage-light:#EDF4F0;
  --sage-dark:#4A7060;
  --blush:#FDF0EC;
  --blush-dark:#C47A65;
  --text:#2C2420;
  --text-mid:#6B5E58;
  --text-light:#A89890;
  --border:#EDE4DC;
  --shadow:0 2px 20px rgba(44,36,32,0.07);
  --radius:16px;
}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
  padding-bottom:4rem;
}

/* HERO */
.hero{
  background:var(--warm);
  border-bottom:1px solid var(--border);
  padding:2.5rem 1.5rem 2rem;
  text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,#F5DDD5 0%,transparent 70%);pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;background:radial-gradient(circle,#DFF0E8 0%,transparent 70%);pointer-events:none;}
.hero-tag{display:inline-block;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-dark);background:var(--sage-light);border-radius:20px;padding:4px 14px;margin-bottom:0.8rem;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3rem);font-weight:600;color:var(--text);line-height:1.2;margin-bottom:0.5rem;}
.hero h1 span{color:var(--sage-dark);font-style:italic;}
.hero p{font-size:14px;color:var(--text-mid);font-weight:300;max-width:420px;margin:0 auto 1.5rem;line-height:1.6;}

/* SYNC STATUS */
.sync-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-light);margin-bottom:1rem;
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background 0.3s;}
.sync-dot.live{background:var(--sage);}
.sync-dot.saving{background:#f0c070;animation:pulse 0.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* PROGRESS */
.progress-area{max-width:460px;margin:0 auto;}
.progress-stats{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.progress-count{font-size:13px;color:var(--text-mid);}
.progress-pct{font-family:'Playfair Display',serif;font-size:22px;color:var(--sage-dark);}
.progress-track{height:6px;background:var(--border);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-dark));border-radius:10px;transition:width 0.4s ease;width:0%;}

/* CONTAINER */
.container{max-width:700px;margin:0 auto;padding:1.5rem 1rem 0;}

/* LIST HEADING */
.list-heading{
  font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:600;
  color:var(--text);margin:2rem 0 0.8rem;
  padding-bottom:0.5rem;border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.lh-tag{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.lh-orig{background:var(--sage-light);color:var(--sage-dark);}
.lh-new{background:var(--blush);color:var(--blush-dark);}

/* SECTION CARD */
.section{
  background:var(--warm);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:0.8rem;
  overflow:hidden;box-shadow:var(--shadow);transition:box-shadow 0.2s;
}
.section:hover{box-shadow:0 4px 28px rgba(44,36,32,0.1);}
.section-head{
  display:flex;align-items:center;gap:10px;
  padding:0.9rem 1.1rem;cursor:pointer;
  border-bottom:1px solid var(--border);
  user-select:none;transition:background 0.15s;
}
.section-head:hover{background:var(--cream);}
.section-icon{font-size:20px;flex-shrink:0;}
.section-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--text);flex:1;}
.section-badge{font-size:11px;color:var(--text-light);background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap;}
.section-badge.complete{color:var(--sage-dark);background:var(--sage-light);border-color:var(--sage);}
.section-chevron{color:var(--text-light);font-size:11px;transition:transform 0.2s;flex-shrink:0;}
.section.collapsed .section-chevron{transform:rotate(-90deg);}
.section-bar{height:3px;background:var(--border);}
.section-bar-fill{height:3px;background:var(--sage);transition:width 0.3s;width:0%;}
.section-body{padding:0.2rem 0;}
.section.collapsed .section-body,.section.collapsed .section-bar{display:none;}

/* ITEM ROW */
.item{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 1.1rem;cursor:pointer;
  transition:background 0.12s;
  border-bottom:1px solid rgba(237,228,220,0.5);
}
.item:last-child{border-bottom:none;}
.item:hover{background:var(--cream);}
.item-check{
  width:18px;height:18px;border:1.5px solid var(--border);
  border-radius:5px;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;background:white;
}
.item.checked .item-check{background:var(--sage);border-color:var(--sage);}
.item.checked .item-check::after{content:'✓';color:white;font-size:11px;font-weight:600;}
.item-texts{flex:1;}
.item-en{font-size:13.5px;color:var(--text);line-height:1.4;transition:color 0.15s;}
.item-de{font-size:11.5px;color:var(--text-light);margin-top:1px;font-style:italic;}
.item.checked .item-en{color:var(--text-light);text-decoration:line-through;}
.item.checked .item-de{color:#c5b8b0;}

/* CELEBRATE */
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0.8);opacity:0;}60%{transform:translate(-50%,-50%) scale(1.1);}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.celebrate{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;text-align:center;box-shadow:0 20px 60px rgba(44,36,32,0.18);z-index:999;max-width:300px;width:90%;}
.celebrate.show{display:block;animation:pop 0.4s ease forwards;}
.celebrate-emoji{font-size:44px;margin-bottom:0.6rem;display:block;}
.celebrate h2{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:0.4rem;}
.celebrate p{font-size:13px;color:var(--text-mid);font-weight:300;line-height:1.6;margin-bottom:1rem;}
.celebrate button{background:var(--sage);color:white;border:none;border-radius:10px;padding:9px 24px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.overlay{display:none;position:fixed;inset:0;background:rgba(44,36,32,0.3);z-index:998;}
.overlay.show{display:block;}

/* FOOTER */
.footer{text-align:center;padding:2.5rem 1rem 1rem;font-size:12px;color:var(--text-light);font-weight:300;}

@media(max-width:480px){
  .hero{padding:2rem 1rem 1.5rem;}
  .container{padding:1rem 0.75rem 0;}
  .section-head{padding:0.8rem 0.9rem;}
  .item{padding:8px 0.9rem;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">Baby Preparation · نونو أهو</div>
  <h1>Welcome to <span>NounouAhuu</span> 🍼</h1>
  <p>Tap each item to check it off. Progress syncs automatically across all devices.</p>
  <div class="sync-badge">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connecting…</span>
  </div>
  <div class="progress-area">
    <div class="progress-stats">
      <span class="progress-count" id="prog-count">0 of 0 items</span>
      <span class="progress-pct" id="prog-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
  </div>
</div>

<div class="container" id="app"></div>
<div class="footer">NounouAhuu 🍼 &nbsp;·&nbsp; Syncs across all your devices</div>

<div class="overlay" id="overlay" onclick="closeCelebrate()"></div>
<div class="celebrate" id="celebrate">
  <span class="celebrate-emoji">🎉</span>
  <h2>All ready!</h2>
  <p>Everything is prepared for your little one's arrival. Congratulations! 💛</p>
  <button onclick="closeCelebrate()">Thank you! 💛</button>
</div>

<script>
// ===== DATA =====
const originalSections = [
  {
    icon:'🧴', title:'Toiletries & Health · Drogerieartikel',
    items:[
      {id:'o_a1',  en:'Diapers',                                          de:'Windeln'},
      {id:'o_a2',  en:'Baby wipes',                                       de:'Feuchttücher'},
      {id:'o_a3',  en:'Baby shampoo',                                     de:'Baby Shampoo'},
      {id:'o_a4',  en:'Baby oil',                                         de:'Baby Öl'},
      {id:'o_a5',  en:'Baby thermometer',                                 de:'Thermometer für Baby'},
      {id:'o_a6',  en:'Bath thermometer',                                 de:'Thermometer für Badewanne'},
      {id:'o_a7',  en:'Diaper rash cream',                                de:'Wundschutz Creme'},
      {id:'o_a8',  en:'Ready-to-feed formula pre HA (Hipp / Aptamil)',    de:'Fertig Milch pre HA Hipp/Aptamil'},
      {id:'o_a9',  en:'Bottles with teats — Lansinoh brand, size S & M', de:'Flasche mit Sauger — Marke Lansinoh, Größe S und M'},
      {id:'o_a10', en:'Sterilizer (optional)',                            de:'Sterilisator (ggf.)'},
      {id:'o_a11', en:'Pacifier / dummy',                                 de:'Schnuller'},
      {id:'o_a12', en:'Lanolin ointment',                                 de:'Lanolin Salbe'},
      {id:'o_a13', en:'Octenisept antiseptic spray',                      de:'Octenisept'},
      {id:'o_a14', en:'Sterile gauze pads',                               de:'Sterille Kompresse'},
      {id:'o_a15', en:'Nipple shields',                                   de:'Stillhütchen'},
    ]
  },
  {
    icon:'👕', title:'Clothing · Kleidung',
    items:[
      {id:'o_c1',  en:'Towels',                    de:'Handtücher'},
      {id:'o_c2',  en:'Washcloths',                de:'Waschlappen'},
      {id:'o_c3',  en:'Burp cloths / muslin cloths',de:'Spucktücher'},
      {id:'o_c4',  en:'10 onesies / bodysuits',    de:'10 Bodies'},
      {id:'o_c5',  en:'5 rompers / trousers',      de:'5 Strampler / Hosen'},
      {id:'o_c6',  en:'3 pajamas / sleepsuits',    de:'3 Schlafanzüge'},
      {id:'o_c7',  en:'5 pairs of socks',          de:'5 Paar Söckchen'},
      {id:'o_c8',  en:'2 sleep sacks',             de:'2 Schlafsäcke'},
      {id:'o_c9',  en:'3 T-shirts',                de:'3 Tshirts'},
      {id:'o_c10', en:'2 cardigans / jackets',     de:'2 Jäckchen'},
      {id:'o_c11', en:'Long-sleeve shirts',        de:'Langarmshirts'},
    ]
  },
  {
    icon:'🛏️', title:'Equipment · Organisatorisches',
    items:[
      {id:'o_e1', en:'3-in-1 stroller / pram (with changing bag)', de:'3-in-1 Kinderwagen (evtl. mit Wickeltasche)'},
      {id:'o_e2', en:'Baby bathtub',                               de:'Badewanne'},
      {id:'o_e3', en:'Changing table',                             de:'Wickeltisch'},
      {id:'o_e4', en:'Baby crib (from Schudi?)',                   de:'Babybett (von Schudi?)'},
      {id:'o_e5', en:'Baby carrier (from Meike?)',                 de:'Babytrage (von Meike?)'},
    ]
  },
  {
    icon:'🤱', title:'For me · Für mich',
    items:[
      {id:'o_m1', en:'Nursing bras',    de:'Still-BHs'},
      {id:'o_m2', en:'Nursing pads',   de:'Stilleinlagen'},
      {id:'o_m3', en:'Nursing pillow', de:'Stillkissen'},
    ]
  }
];

const addedSections = [
  {
    icon:'🧴', title:'Toiletries & Health — Extras',
    items:[
      {id:'n_a1', en:'Saline nasal drops',                    de:'Salzwasser Nasentropfen'},
      {id:'n_a2', en:'Nasal aspirator (e.g. Frida NoseFrida)',de:'Nasensauger (z.B. Frida NoseFrida)'},
      {id:'n_a3', en:'Baby nail scissors or file',            de:'Babynagelschere oder -feile'},
      {id:'n_a4', en:'Soft baby hairbrush',                   de:'Weiche Baby-Haarbürste'},
      {id:'n_a5', en:'Cotton wool balls',                     de:'Wattebäusche'},
    ]
  },
  {
    icon:'🤱', title:'Breastfeeding — Extras',
    items:[
      {id:'n_b1', en:'Breast pump (manual or electric)', de:'Milchpumpe (manuell oder elektrisch)'},
      {id:'n_b2', en:'Milk storage bags',               de:'Muttermilchbeutel'},
      {id:'n_b3', en:'Nursing cover / scarf',           de:'Stillschal / Stillabdeckung'},
      {id:'n_b4', en:'Bottle brush',                    de:'Flaschenbürste'},
    ]
  },
  {
    icon:'👕', title:'Clothing — Extras',
    items:[
      {id:'n_c1', en:'2 soft hats (newborn size)', de:'2 weiche Mützen (Neugeborengröße)'},
      {id:'n_c2', en:'Scratch mittens',            de:'Kratzfäustlinge'},
      {id:'n_c3', en:'2 hooded baby towels',       de:'2 Kapuzenbadetücher'},
    ]
  },
  {
    icon:'🛏️', title:'Sleeping — Extras',
    items:[
      {id:'n_d1', en:'Firm, flat mattress for crib',      de:'Feste, flache Matratze für Babybett'},
      {id:'n_d2', en:'2–3 fitted crib sheets',            de:'2–3 Spannbettlaken'},
      {id:'n_d3', en:'Waterproof mattress protector',     de:'Wasserdichter Matratzenschutz'},
      {id:'n_d4', en:'Bedside bassinet / co-sleeper',     de:'Beistellbett / Co-Sleeper'},
      {id:'n_d5', en:'White noise machine',               de:'Weißrauschmaschine'},
    ]
  },
  {
    icon:'🛁', title:'Bathing & Changing — Extras',
    items:[
      {id:'n_e1', en:'Waterproof changing mat (wipeable)', de:'Wasserdichte Wickelunterlage (abwischbar)'},
      {id:'n_e2', en:'Nappy bin / diaper pail',           de:'Windeleimer'},
    ]
  },
  {
    icon:'🚗', title:'Getting Around — Extras',
    items:[
      {id:'n_f1', en:'Infant car seat (Group 0+)', de:'Babyschale (Gruppe 0+)'},
      {id:'n_f2', en:'Rain cover for stroller',   de:'Regenschutz für Kinderwagen'},
    ]
  },
  {
    icon:'🧸', title:'Nice to Have · Schön zu haben',
    items:[
      {id:'n_g1', en:'Baby monitor (audio or video)',  de:'Babyphone (Audio oder Video)'},
      {id:'n_g2', en:'Bouncer or rocker seat',         de:'Babywippe'},
      {id:'n_g3', en:'Play mat with activity arch',    de:'Spielmatte mit Aktivitätsbogen'},
      {id:'n_g4', en:'3–4 swaddle blankets',           de:'3–4 Pucktücher'},
      {id:'n_g5', en:'3–4 muslin blankets',            de:'3–4 Musselin-Decken'},
    ]
  }
];

// ===== STATE =====
let checked = {};
let fbReady = false;
let saveTimer = null;

// ===== FIREBASE =====
function initFirebase() {
  fbReady = true;
  setSyncStatus('live','Synced ✓');
  window._onValue(window._ref(window._db,'nounou/checked'), snap => {
    const val = snap.val();
    checked = val || {};
    renderAll();
    updateProgress();
  });
}

function saveToFirebase() {
  if (!fbReady) { saveLocal(); return; }
  setSyncStatus('saving','Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    window._set(window._ref(window._db,'nounou/checked'), checked)
      .then(()=>setSyncStatus('live','Synced ✓'))
      .catch(()=>setSyncStatus('','Error — saved locally'));
    saveLocal();
  }, 600);
}

function saveLocal() {
  try { localStorage.setItem('nounou-v1', JSON.stringify(checked)); } catch(e){}
}
function loadLocal() {
  try { const s = localStorage.getItem('nounou-v1'); if(s) checked = JSON.parse(s); } catch(e){}
}

function setSyncStatus(state, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot' + (state ? ' '+state : '');
  lbl.textContent = label;
}

// ===== RENDER =====
function buildSection(sec, uid) {
  const div = document.createElement('div');
  div.className = 'section';
  div.id = 'sec-'+uid;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <span class="section-icon">${sec.icon}</span>
    <span class="section-title">${sec.title}</span>
    <span class="section-badge" id="sbadge-${uid}">0 / ${sec.items.length}</span>
    <span class="section-chevron">▾</span>
  `;
  head.addEventListener('click', ()=>div.classList.toggle('collapsed'));

  const bar = document.createElement('div');
  bar.className = 'section-bar';
  const bf = document.createElement('div');
  bf.className = 'section-bar-fill';
  bf.id = 'sbar-'+uid;
  bar.appendChild(bf);

  const body = document.createElement('div');
  body.className = 'section-body';

  sec.items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item' + (checked[item.id] ? ' checked' : '');
    row.id = 'item-'+item.id;
    row.innerHTML = `
      <div class="item-check"></div>
      <div class="item-texts">
        <div class="item-en">${item.en}</div>
        <div class="item-de">${item.de}</div>
      </div>
    `;
    row.addEventListener('click', ()=>toggleItem(item.id));
    body.appendChild(row);
  });

  div.appendChild(head);
  div.appendChild(bar);
  div.appendChild(body);
  return div;
}

function toggleItem(id) {
  checked[id] = !checked[id];
  const el = document.getElementById('item-'+id);
  if (el) el.classList.toggle('checked', checked[id]);
  updateProgress();
  saveToFirebase();
}

function renderAll() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const h1 = document.createElement('div');
  h1.className = 'list-heading';
  h1.innerHTML = 'Original List · Originalliste <span class="lh-tag lh-orig">Mama\'s list</span>';
  app.appendChild(h1);
  originalSections.forEach((sec,i) => app.appendChild(buildSection(sec,'o'+i)));

  const h2 = document.createElement('div');
  h2.className = 'list-heading';
  h2.innerHTML = 'Recommended Additions · Empfehlungen <span class="lh-tag lh-new">Added for you</span>';
  app.appendChild(h2);
  addedSections.forEach((sec,i) => app.appendChild(buildSection(sec,'a'+i)));

  updateProgress();
}

function updateProgress() {
  const all = [...originalSections, ...addedSections];
  all.forEach((sec, idx) => {
    const uid = idx < originalSections.length ? 'o'+idx : 'a'+(idx-originalSections.length);
    const total = sec.items.length;
    const done = sec.items.filter(x=>checked[x.id]).length;
    const badge = document.getElementById('sbadge-'+uid);
    const bar = document.getElementById('sbar-'+uid);
    if (badge) { badge.textContent = done+' / '+total; badge.className = 'section-badge'+(done===total?' complete':''); }
    if (bar) bar.style.width = (total ? Math.round(done/total*100) : 0)+'%';
  });
  const allItems = all.flatMap(s=>s.items);
  const total = allItems.length;
  const done = allItems.filter(i=>checked[i.id]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('prog-count').textContent = done+' of '+total+' items';
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
  if (pct===100 && done>0) {
    document.getElementById('celebrate').classList.add('show');
    document.getElementById('overlay').classList.add('show');
  }
}

function closeCelebrate() {
  document.getElementById('celebrate').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ===== INIT =====
loadLocal();
renderAll();

if (window._fbReady) {
  initFirebase();
} else {
  setSyncStatus('','Local mode');
  document.addEventListener('fb-ready', initFirebase);
}
</script>
</body>
</html>
